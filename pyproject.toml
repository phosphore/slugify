[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sdn-slugify"
version = "1.0.0"
description = "Unicode-aware slug generator, stdlib only — library + CLI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sentinel Dev Network" }]
requires-python = ">=3.9"
keywords = ["slug", "slugify", "url", "unicode", "transliteration", "cli"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Text Processing :: Filters",
]

[project.urls]
Homepage = "https://github.com/sentinel-dev-network/slugify"

[project.scripts]
slugify = "slugify.__main__:main"

[tool.setuptools]
packages = ["slugify"]
